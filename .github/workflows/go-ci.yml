name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go test ./...
      - run: go build -o forge .
      - uses: actions/setup-go@v5
        with:
          go-version-file: example/apps/backend/go.mod
          cache-dependency-path: example/apps/backend/go.sum
      - name: Regenerate example
        working-directory: example
        run: ../forge build
      - name: Test generated backend and integration tests
        working-directory: example/apps/backend
        run: go test ./...
      - name: Build example backend
        working-directory: example/apps/backend
        run: go build ./...
