name: Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: example/apps/backend/go.mod
          cache-dependency-path: |
            go.sum
            example/apps/backend/go.sum
      - run: go test ./...
      - run: go build -o forge .
      - name: Regenerate example
        working-directory: example
        run: |
          sed '/^forgeVersion:/d' .forge.yml > .forge-ci.yml
          ../forge build --config .forge-ci.yml
          test -f apps/backend/generated/tenant_record/permissions.go
      - name: Test generated backend and integration tests
        working-directory: example/apps/backend
        run: go test ./...
      - name: Build example backend
        working-directory: example/apps/backend
        run: go build ./...
